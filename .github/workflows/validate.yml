name: Gemini source and runtime conformance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  exact-source-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Rebuild from immutable upstream and reject altered payloads
        run: python -B tools/build_gemini.py --check . --self-test
      - name: Real coordinator and every native entrypoint
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B skills/chief-of-staff/scripts/run.py self-test
          python -B - <<'PYTHON'
          import json, pathlib, subprocess, sys
          entries = sorted(pathlib.Path('skills').glob('*/scripts/run.py'))
          assert len(entries) == 62
          for entry in entries:
              context = json.loads(subprocess.check_output([sys.executable, '-B', str(entry), '--context'], text=True))
              assert context['source_commit'] == 'cd1898c6dc062a2dcf01a56b53403023c1994c8d'
          print('PASS: 61 employees + chief-of-staff, 62 actual contexts')
          PYTHON

      - name: Offline installation and explicit setup boundaries
        run: python -B -m unittest discover -s tests -p test_explicit_runtime_setup.py
